<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;height:100%;min-height:180px;padding:18px 0 26px 34px;box-sizing:border-box">
  <div style="position:relative;width:100%;height:100%">
    <div style="position:absolute;left:-34px;top:-18px;font-size:10.5px;color:#8A93A0;font-weight:600">BPM</div>
    <div style="position:absolute;left:0;right:0;top:12.5%;border-top:1px solid #EEF0F3"></div>
    <div style="position:absolute;left:0;right:0;top:37.5%;border-top:1px solid #EEF0F3"></div>
    <div style="position:absolute;left:0;right:0;top:62.5%;border-top:1px solid #EEF0F3"></div>
    <div style="position:absolute;left:0;right:0;top:87.5%;border-top:1px solid #EEF0F3"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;border-top:1px solid #D9DDE3"></div>
    <div style="position:absolute;left:-34px;width:26px;text-align:right;top:12.5%;transform:translateY(-50%);font-size:11px;color:#8A93A0;font-variant-numeric:tabular-nums">120</div>
    <div style="position:absolute;left:-34px;width:26px;text-align:right;top:37.5%;transform:translateY(-50%);font-size:11px;color:#8A93A0;font-variant-numeric:tabular-nums">100</div>
    <div style="position:absolute;left:-34px;width:26px;text-align:right;top:62.5%;transform:translateY(-50%);font-size:11px;color:#8A93A0;font-variant-numeric:tabular-nums">80</div>
    <div style="position:absolute;left:-34px;width:26px;text-align:right;top:87.5%;transform:translateY(-50%);font-size:11px;color:#8A93A0;font-variant-numeric:tabular-nums">60</div>
    <sc-for list="{{ c.bands }}" as="bd" hint-placeholder-count="0">
      <div style="position:absolute;top:0;bottom:0;left:{{ bd.left }};width:{{ bd.width }};background:{{ bd.bg }};border-radius:4px">
        <div style="position:absolute;top:6px;left:6px;font-size:10.5px;font-weight:700;white-space:nowrap;color:{{ bd.color }}">급격한 변화</div>
      </div>
    </sc-for>
    <sc-if value="{{ c.hasAvg }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;right:0;top:{{ c.avgTop }};border-top:1.5px dashed #3A4350"></div>
    </sc-if>
    <svg viewBox="0 0 1000 300" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">
      <path d="{{ c.lo }}" style="fill:none;stroke:oklch(0.62 0.19 255);stroke-width:2.25px;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke"></path>
      <path d="{{ c.hi }}" style="fill:none;stroke:oklch(0.62 0.19 25);stroke-width:2.25px;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke"></path>
    </svg>
    <sc-if value="{{ c.hasAvg }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;right:0;top:{{ c.avgTop }};transform:translateY(calc(-100% - 4px));font-size:11.5px;font-weight:700;color:#3A4350;background:rgba(255,255,255,0.92);padding:1px 6px;border-radius:5px;font-variant-numeric:tabular-nums">{{ c.avgLabel }}</div>
    </sc-if>
    <sc-if value="{{ c.head.show }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:{{ c.head.left }};top:{{ c.head.top }};width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:{{ c.head.color }};box-shadow:0 0 0 4px rgba(15,20,25,0.08)"></div>
    </sc-if>
    <sc-for list="{{ c.anomalies }}" as="a" hint-placeholder-count="0">
      <div style="position:absolute;left:{{ a.left }};top:{{ a.top }};width:0;height:0">
        <div style="position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:#FFFFFF;border:2.5px solid oklch(0.75 0.15 70)"></div>
        <div style="position:absolute;left:0;top:0;transform:{{ a.tx }};white-space:nowrap;display:flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 6px;border-radius:7px;background:oklch(0.975 0.035 85);border:1px solid oklch(0.88 0.08 80);font-size:11.5px;font-weight:600;color:oklch(0.43 0.1 60)">
          <span style="width:14px;height:14px;border-radius:50%;background:oklch(0.75 0.15 70);color:#FFFFFF;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center">!</span>
          <span style="font-variant-numeric:tabular-nums;font-weight:700">{{ a.label }}</span><span>오류 가능성</span>
        </div>
      </div>
    </sc-for>
    <sc-if value="{{ c.empty.show }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13.5px;color:#8A93A0;font-weight:500">{{ c.empty.text }}</div>
    </sc-if>
    <sc-for list="{{ c.ticks }}" as="k" hint-placeholder-count="4">
      <div style="position:absolute;top:calc(100% + 8px);left:{{ k.left }};transform:translateX(-50%);font-size:11px;color:#8A93A0;font-variant-numeric:tabular-nums;white-space:nowrap">{{ k.label }}</div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:280},&quot;c&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
